embedding:
  model_name: "BAAI/bge-m3"
  device: "cpu"

chunking:
  chunk_size: 10
  overlap: 3

qdrant:
  host: "localhost"
  port: 6333
  collection_name: "enterprise_docs"
  vector_size: 1024

retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  fusion_top_k: 20
  reranker_top_k: 5

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

llm:
  model: "ollama/qwen2.5:3b"
  max_tokens: 256
  temperature: 0.1

data:
  raw_docs_path: "data/raw"

evaluation:
  test_set_path: "data/eval/test_set.json"
  results_output_path: "data/eval/eval_results.json"