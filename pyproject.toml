[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-warehouse-vision-system"
version = "1.1.0"
description = "Realtime warehouse vision, lifecycle processing, MySQL persistence, and operations dashboard"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
warehouse-vision = "visiontrack.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
