name: RAG V1 deterministic tests

on:
  pull_request:
    paths:
      - "Generative-AI/enterprise-rag-assistant-v1/**"
      - ".github/workflows/rag-v1-tests.yml"
  push:
    branches: [main]
    paths:
      - "Generative-AI/enterprise-rag-assistant-v1/**"
      - ".github/workflows/rag-v1-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Generative-AI/enterprise-rag-assistant-v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Generative-AI/enterprise-rag-assistant-v1/requirements.txt
      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src scripts tests
      - name: Run offline tests (no API secrets)
        run: python -m pytest -q

  build-retrieval-artifacts:
    name: Offline ingestion + BM25 build
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Generative-AI/enterprise-rag-assistant-v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Generative-AI/enterprise-rag-assistant-v1/requirements-artifacts.txt
      - name: Install pinned offline build dependencies
        run: python -m pip install -r requirements-artifacts.txt
      - name: Build and verify retrieval artifacts without API keys
        run: python -m scripts.build_retrieval_artifacts
      - name: Check gold and saved retrieval chunk IDs
        run: python -m scripts.validate_evaluation_chunk_ids
      - name: Upload reproducible artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rag-v1-retrieval-artifacts
          path: |
            Generative-AI/enterprise-rag-assistant-v1/data/processed/*.jsonl
            Generative-AI/enterprise-rag-assistant-v1/data/processed/retrieval_artifact_manifest.json
            Generative-AI/enterprise-rag-assistant-v1/data/bm25/
          if-no-files-found: error
          retention-days: 7
