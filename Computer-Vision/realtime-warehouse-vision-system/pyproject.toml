[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-warehouse-vision-system"
version = "1.0.0"
description = "Real-time warehouse vision system using YOLO, QR identification, tracking, warehouse event logic, MySQL, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
visiontrack = "visiontrack.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]